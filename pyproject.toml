[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-racer-python"
version = "1.0.0"
description = "A professional pixel-art arcade racing game engine built in pure Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Retro Racer Team" }
]
keywords = ["game", "pygame", "arcade", "retro", "pixel-art", "racing"]
dependencies = [
    "pygame-ce>=2.4.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
retro-racer = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
